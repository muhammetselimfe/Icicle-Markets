<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background square with glow -->
  <rect width="64" height="64" fill="#0a0e27" rx="4"/>
  <rect width="64" height="64" fill="url(#bgGlow)" rx="4" opacity="0.3"/>
  
  <!-- Icicle Icon -->
  <g transform="translate(32, 12)">
    <!-- Outer glow -->
    <path d="M0 0 L16 48 L-16 48 Z" fill="#8be4ff" opacity="0.3" filter="url(#blur)"/>
    
    <!-- Main icicle -->
    <path d="M0 0 L16 48 L-16 48 Z" fill="url(#icicleGradient)" stroke="#4db8ff" stroke-width="2.5"/>
    
    <!-- Inner highlight -->
    <path d="M0 0 L10 30 L-10 30 Z" fill="#b8f0ff" opacity="0.6"/>
    
    <!-- Ice crystals -->
    <circle cx="0" cy="10" r="2.5" fill="#ffffff" opacity="0.9"/>
    <circle cx="-4" cy="18" r="2" fill="#ffffff" opacity="0.7"/>
    <circle cx="4" cy="22" r="2" fill="#ffffff" opacity="0.7"/>
    <circle cx="0" cy="30" r="1.5" fill="#ffffff" opacity="0.6"/>
    <circle cx="-6" cy="36" r="1.5" fill="#ffffff" opacity="0.5"/>
    <circle cx="6" cy="38" r="1.5" fill="#ffffff" opacity="0.5"/>
  </g>
  
  <!-- Gradients and Filters -->
  <defs>
    <linearGradient id="icicleGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8be4ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#4db8ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2a8fcc;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="bgGlow">
      <stop offset="0%" style="stop-color:#8be4ff;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#8be4ff;stop-opacity:0" />
    </radialGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>
</svg>
